[workspace]
resolver = "2"
members = [
    "crates/wisp-cognition-core",
    "crates/wisp-cognition-wasm",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wisp-cognition-core = { path = "crates/wisp-cognition-core" }
